server:
  port: 8083

spring:
  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/fitness_recommendations?authSource=admin
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking

gen-ai:
  api:
    url: ${AI_API_URL}
    key: ${AI_API_KEY}
