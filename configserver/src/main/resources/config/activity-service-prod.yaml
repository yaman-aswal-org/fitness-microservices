server:
  port: ${PORT:8082}

spring:
  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/fitness_activity_db?authSource=admin
  rabbitmq:
    host: ${RABBIT_MQ_HOST}
    port: ${RABBIT_MQ_PORT}
    username: ${RABBIT_MQ_USERNAME}
    password: ${RABBIT_MQ_PASSWORD}

rabbitmq:
  exchange:
    name: ${RABBITMQ_EXCHANGE:fitness.exchange}
  queue:
    name: ${RABBITMQ_QUEUE:activity.queue}
  routing:
    key: ${RABBITMQ_ROUTING_KEY:activity.tracking}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
